version: '3.8'

services:
  db:
    image: postgres:15
    container_name: imtracker_db_prod
    environment:
      - POSTGRES_DB=imtracker
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d imtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: imtracker_web_prod
    command: gunicorn IncidenciasApp.wsgi:application --bind 0.0.0.0:8000 --timeout 120 --log-level info
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=imtracker
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - DJANGO_SETTINGS_MODULE=IncidenciasApp.settings
      - DJANGO_DEBUG=${DJANGO_DEBUG:-false}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: imtracker_n8n_prod
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
    volumes:
      - n8n_data_prod:/home/node/.n8n

volumes:
  n8n_data_prod:
  postgres_data_prod:
