{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Contraseña Actualizada" %} - IMTracker</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="{% static 'css/output.css' %}">

    <!-- Estilos BEM del Login -->
    <link rel="stylesheet" href="{% static 'css/login.css' %}">

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'img/logoIMTracker.png' %}">
</head>

<body class="login-page">

    <div class="login-page__background">
        <div class="login-page__shape login-page__shape--1"></div>
        <div class="login-page__shape login-page__shape--2"></div>
        <div class="login-page__shape login-page__shape--3"></div>
    </div>

    <!-- Contenedor principal con Grid Layout -->
    <main class="login-page__container">

        <!-- Panel izquierdo: Branding -->
        <section class="login-branding">
            <div class="login-branding__content">
                <div class="login-branding__logo">
                    <img src="{% static 'img/logoIMTracker.png' %}" alt="IMTracker Logo" class="login-branding__logo-img">
                </div>
                <h1 class="login-branding__title">IMTracker</h1>
                <p class="login-branding__subtitle">{% trans "Seguridad de la Cuenta" %}</p>
            </div>
        </section>

        <!-- Panel derecho: Éxito -->
        <section class="login-form">
            <div class="login-form__wrapper" style="text-align: center;">
                <div class="login-form__header" style="align-items: center;">
                    <div class="login-form__avatar" style="background-color: rgba(34, 197, 94, 0.2); color: #22c55e;">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <h2 class="login-form__title">{% trans "¡Contraseña Actualizada!" %}</h2>
                    <p class="login-form__description">{% trans "Tu contraseña ha sido cambiada correctamente." %}</p>
                </div>

                <div class="login-form__body" style="margin-top: 2rem;">
                    <a href="{% url 'incidencias:dashboard' %}" class="login-form__submit" style="text-decoration: none; display: flex; justify-content: center; align-items: center;">
                        {% trans "Volver al Dashboard" %}
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12h15m0 0l-6.75-6.75M19.5 12l-6.75 6.75" />
                        </svg>
                    </a>
                </div>
            </div>
        </section>

    </main>

</body>

</html>
