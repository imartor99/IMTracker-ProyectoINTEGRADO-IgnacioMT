version: '3.8'

services:
  db:
    image: postgres:15
    container_name: imtracker_db
    environment:
      - POSTGRES_DB=imtracker
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: imtracker_web
    # Usamos gunicorn para producción en el puerto 8000
    command: gunicorn IncidenciasApp.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=imtracker
      - DB_USER=${DB_USER:-imtracker_user}
      - DB_PASSWORD=${DB_PASSWORD:-imtracker_pass}
      - DJANGO_SETTINGS_MODULE=incidencias_app.settings
    depends_on:
      - db

  n8n:
    image: n8nio/n8n:latest
    container_name: imtracker_n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Madrid
      - TZ=Europe/Madrid
    volumes:
      - n8n_data:/home/node/.n8n

  ollama:
    image: ollama/ollama:latest
    container_name: imtracker_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Quitamos la sección de GPU ya que la t2.micro de AWS usa CPU

volumes:
  n8n_data:
  postgres_data:
  ollama_data:
