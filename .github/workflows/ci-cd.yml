name: IMTracker CI/CD Pipeline

on:
  workflow_dispatch: # Ejecución puramente manual para control total

jobs:
  # 1. JOB DE PRUEBAS UNITARIAS TEST
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: db_test
          POSTGRES_USER: user_test
          POSTGRES_PASSWORD: password_test
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Entornos
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        npm install
    - name: Ejecutar Tests Python
      env:
        SECRET_KEY: "test-key-ci-cd"
        DB_USER: "user_test"
        DB_PASSWORD: "password_test"
      run: python manage.py test
    - name: Ejecutar Tests JavaScript
      run: npm test

  docs:
    needs: tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configurar Entornos
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Instalar Herramientas de Doc
      run: |
        pip install -r requirements.txt
        npm install
    - name: Generar Documentación (Python & JS)
      env:
        DJANGO_SETTINGS_MODULE: "IncidenciasApp.settings"
      run: |
        mkdir -p documentation/python
        mkdir -p documentation/javascript
        python -c "import os, django, pydoc; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'IncidenciasApp.settings'); django.setup(); pydoc.writedoc('incidencias.views'); pydoc.writedoc('incidencias.models'); pydoc.writedoc('incidencias.urls')"
        mv *.html documentation/python/
        npm run docs --if-present
        if [ -d "js-docs" ]; then mv js-docs/* documentation/javascript/; fi

    - name: Guardar Artefactos
      uses: actions/upload-artifact@v4
      with:
        name: documentación-tecnica-completa
        path: documentation/

  # 3. JOB DE DESPLIEGUE 
  deploy:
    needs: docs
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: Desplegar en EC2 vía SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 0. Limpieza agresiva de disco y SWAP mínimo (512MB)
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 512M /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile || true
          
          # Limpiar logs de sistema y paquetes para ganar espacio crítico
          sudo journalctl --vacuum-time=1s
          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /var/lib/apt/lists/*

          # 1. Instalar Docker y Docker Compose si no existen
          if ! [ -x "$(command -v docker)" ]; then
            sudo apt update && sudo apt install -y docker.io docker-compose
            sudo usermod -aG docker ${{ secrets.EC2_USER }}
          fi

          # 2. Preparar carpeta y actualizar código
          mkdir -p ~/IMTracker
          cd ~/IMTracker
          if [ -d ".git" ]; then
            git pull origin main
          else
            git clone https://github.com/${{ github.repository }}.git .
          fi

          # 2.5 Limpieza de imágenes huérfanas (sin borrar volúmenes de PostgreSQL)
          sudo docker image prune -f
          
          # 2.6 Archivo de entorno para docker-compose (mismas vars en up, exec y migrate)
          {
            echo "DB_USER=${{ secrets.DB_USER }}"
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
            echo "SECRET_KEY=${{ secrets.SECRET_KEY }}"
            echo "DJANGO_DEBUG=false"
            echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}"
            echo "CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}"
          } > .env.prod
          chmod 600 .env.prod
          
          # 3. Levantar la aplicación (PROD sin Ollama)
          sudo docker-compose --env-file .env.prod -f docker-compose.prod.yml down
          sudo docker-compose --env-file .env.prod -f docker-compose.prod.yml up --build -d
          
          # 4. Esperar a que el contenedor web esté listo
          sleep 15
          
          # 5. Estáticos, migraciones y comprobación Django
          sudo docker-compose --env-file .env.prod -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput
          sudo docker-compose --env-file .env.prod -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput
          sudo docker-compose --env-file .env.prod -f docker-compose.prod.yml exec -T web python manage.py check --deploy || true
          
          # 6. Probar HTTP y mostrar logs si falla
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/login/ || echo "000")
          echo "GET /login/ -> HTTP $HTTP_CODE"
          sudo docker logs imtracker_web_prod --tail 100
          if [ "$HTTP_CODE" != "200" ]; then
            sudo docker-compose --env-file .env.prod -f docker-compose.prod.yml logs web --tail 80
            exit 1
          fi
