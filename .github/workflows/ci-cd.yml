name: IMTracker CI/CD Pipeline

on:
  workflow_dispatch: # Ejecución puramente manual para control total

jobs:
  # 1. JOB DE PRUEBAS UNITARIAS TEST
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: db_test
          POSTGRES_USER: user_test
          POSTGRES_PASSWORD: password_test
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v3
    - name: Configurar Entornos
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Instalar Dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        npm install
    - name: Ejecutar Tests Python
      env:
        SECRET_KEY: "test-key-ci-cd"
        DB_USER: "user_test"
        DB_PASSWORD: "password_test"
      run: python manage.py test
    - name: Ejecutar Tests JavaScript
      run: npm test

  docs:
    needs: tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Configurar Entornos
      uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    - uses: actions/setup-node@v3
      with:
        node-version: '18'
    - name: Instalar Herramientas de Doc
      run: |
        pip install -r requirements.txt
        npm install
    - name: Generar Documentación (Python & JS)
      run: |
        mkdir -p documentation/python
        mkdir -p documentation/javascript
        python -m pydoc -w incidencias.views incidencias.models incidencias.urls
        mv *.html documentation/python/
        npm run docs
        mv js-docs/* documentation/javascript/
    - name: Guardar Artefactos
      uses: actions/upload-artifact@v4
      with:
        name: documentación-tecnica-completa
        path: documentation/

  # 3. JOB DE DESPLIEGUE 
  deploy:
    needs: docs
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: Desplegar en EC2 vía SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # 1. Instalar Docker y Docker Compose si no existen
          if ! [ -x "$(command -v docker)" ]; then
            echo "Instalando Docker..."
            sudo apt update && sudo apt install -y docker.io
            sudo systemctl enable --now docker
            sudo usermod -aG docker ${{ secrets.EC2_USER }}
          fi

          if ! [ -x "$(command -v docker-compose)" ]; then
            echo "Instalando Docker Compose..."
            sudo apt install -y docker-compose
          fi

          # 2. Preparar carpeta y actualizar código
          mkdir -p ~/IMTracker
          cd ~/IMTracker

          if [ -d ".git" ]; then
            git pull origin main
          else
            git clone https://github.com/${{ github.repository }}.git .
          fi

          # 3. Levantar la aplicación
          sudo docker-compose down
          sudo docker-compose up --build -d
          
          # 4. Limpieza de imágenes huérfanas
          sudo docker image prune -f
